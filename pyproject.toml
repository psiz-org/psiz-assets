[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psiz-assets"
version = "1.0.0"
description = "Published PsiZ scientific resources and benchmark catalog"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	"huggingface_hub",
]

[project.optional-dependencies]
docs = [
	"sphinx>=7.0",
	"sphinx-rtd-theme>=1.3",
]

[project.urls]
Documentation = "https://psiz-assets.readthedocs.io"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
psiz_assets = ["manifests/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
